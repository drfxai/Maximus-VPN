name: Maximus Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.0.0'
        required: true
        default: 'v1.0.0'

env:
  XRAY_VERSION: '26.7.28'
  # Wintun driver required by Xray's TUN inbound on Windows.
  WINTUN_VERSION: '0.14.1'
  WINTUN_SHA256: 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce'

jobs:
  android:
    name: Android APK + AAB (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Compute version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION//./}" >> "$GITHUB_OUTPUT"
      - name: Download Xray-core Android arm64-v8a
        shell: bash
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 3 -o xray-android.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -o xray-android.zip -d xray-android-unpacked
          XRAY_BIN=$(find xray-android-unpacked -type f -name xray | head -n 1)
          test -n "$XRAY_BIN"
          cp "$XRAY_BIN" app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Build Android release artifacts
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease \
            -PversionName=${{ steps.version.outputs.version }} \
            -PversionCode=${{ steps.version.outputs.code }} \
            --no-daemon
      - name: Collect Android artifacts
        shell: bash
        run: |
          mkdir -p release/android
          cp app/build/outputs/apk/release/*.apk release/android/Maximus-VPN-Android-arm64-v8a-${{ steps.version.outputs.version }}.apk || true
          cp app/build/outputs/bundle/release/*.aab release/android/Maximus-VPN-Android-arm64-v8a-${{ steps.version.outputs.version }}.aab || true
      - uses: actions/upload-artifact@v4
        with:
          name: maximus-android
          path: release/android/*

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Download Xray-core Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src/main/resources/xray | Out-Null
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v${env:XRAY_VERSION}/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray-unpacked -Force
          $x = Get-ChildItem xray-unpacked -Recurse -Filter xray.exe | Select-Object -First 1
          if (-not $x) { throw 'Xray Windows x64 binary was not found in the archive.' }
          Copy-Item $x.FullName desktop/src/main/resources/xray/xray.exe -Force
      - name: Download Wintun (pinned, checksum-verified)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-${env:WINTUN_VERSION}.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-unpacked -Force
          $dll = "wintun-unpacked/wintun/bin/amd64/wintun.dll"
          if (-not (Test-Path $dll)) { throw 'wintun.dll (amd64) was not found in the archive.' }
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          Write-Host "wintun.dll sha256 = $hash"
          if ($hash -ne "${env:WINTUN_SHA256}") {
            throw "Wintun checksum mismatch: expected ${env:WINTUN_SHA256}, got $hash"
          }
          Copy-Item $dll desktop/src/main/resources/xray/wintun.dll -Force
      - name: Download geo data (pinned to Xray release tag)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/geoip/releases/download/${env:XRAY_VERSION}/geoip.dat" -OutFile desktop/src/main/resources/xray/geoip.dat
          if ((Get-Item desktop/src/main/resources/xray/geoip.dat).Length -lt 1MB) { throw 'geoip.dat missing or too small' }
          Write-Host "[OK] geoip.dat downloaded"
      - name: Verify runtime resources before packaging
        shell: pwsh
        run: |
          $xray = "desktop/src/main/resources/xray/xray.exe"
          $wtun = "desktop/src/main/resources/xray/wintun.dll"
          foreach ($f in @($xray, $wtun)) {
            if (-not (Test-Path $f)) { throw "Required resource missing: $f" }
            if ((Get-Item $f).Length -lt 100KB) { throw "Resource suspiciously small: $f" }
            $bytes = [System.IO.File]::ReadAllBytes($f)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$f is not a PE binary (bad MZ)" }
          }
          # xray.exe must be x64: PE32+ magic 0x20b at optional header
          $b = [System.IO.File]::ReadAllBytes($xray)
          $peOff = [BitConverter]::ToInt32($b, 0x3C)
          $magic = [BitConverter]::ToUInt16($b, $peOff + 24)
          if ($magic -ne 0x20B) { throw "xray.exe is not x86-64 (PE magic 0x{0:X})" -f $magic }
          Write-Host "[OK] xray.exe (x64) + wintun.dll verified"
      - name: Build Windows MSI and EXE
        shell: pwsh
        working-directory: desktop
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { $env:GITHUB_REF_NAME }
          $version = $tag -replace '^v', ''
          if (-not ($version -match '^[0-9][A-Za-z0-9.+~-]*$')) { $version = "1.0.0" }
          Write-Host "Building with appVersion=$version"
          gradle packageMsi packageExe "-PappVersion=$version" --no-daemon
      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/windows | Out-Null
          Copy-Item desktop/build/compose/binaries/main/msi/*.msi release/windows/ -ErrorAction SilentlyContinue
          Copy-Item desktop/build/compose/binaries/main/exe/*.exe release/windows/ -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem release/windows -File | Where-Object Length -gt 10MB)) {
            throw 'Windows installer(s) missing or implausibly small — packaging failed.'
          }
          # Sanity: installers must be big enough to contain xray (~37MB) + wintun + JRE.
          Get-ChildItem release/windows | ForEach-Object {
            Write-Host ("[OK] {0}  {1:N0} MB" -f $_.Name, ($_.Length/1MB))
            if ($_.Length -lt 60MB) { throw "$($_.Name) is smaller than expected (<60MB); runtime deps likely absent." }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: maximus-windows-x64
          path: release/windows/*

  ubuntu:
    name: Ubuntu x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Download Xray-core Linux x64
        shell: bash
        run: |
          mkdir -p desktop/src/main/resources/xray
          curl -L --fail --retry 3 -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o xray.zip -d xray-unpacked
          XRAY_BIN=$(find xray-unpacked -type f -name xray | head -n 1)
          test -n "$XRAY_BIN"
          cp "$XRAY_BIN" desktop/src/main/resources/xray/xray
          chmod +x desktop/src/main/resources/xray/xray
      - name: Build Ubuntu DEB
        shell: bash
        working-directory: desktop
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9][A-Za-z0-9.+~-]*$ ]]; then VERSION="1.0.0"; fi
          echo "Building with appVersion=$VERSION"
          gradle packageDeb -PappVersion="$VERSION" --no-daemon
      - name: Collect Ubuntu artifacts
        shell: bash
        run: |
          mkdir -p release/ubuntu
          cp desktop/build/compose/binaries/main/deb/*.deb release/ubuntu/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: maximus-ubuntu-x64
          path: release/ubuntu/*

  publish:
    name: Publish GitHub Release
    needs: [android, windows, ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p flat
          find release-assets -type f -maxdepth 4 -exec cp {} flat/ \;
          # Publish job has no git checkout; gh needs --repo to work outside one.
          gh release create "$TAG" flat/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Maximus VPN $TAG" \
            --notes "Maximus VPN $TAG — Android APK/AAB (arm64-v8a), Windows x64 MSI/EXE, Ubuntu x64 DEB."
