name: Maximus CI Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  XRAY_VERSION: '26.7.28'

jobs:
  android:
    name: Android Debug + Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Pin to match release.yml and local verification — unpinned pulls
          # newer Gradle whose bundled Kotlin breaks the Compose compiler plugin.
          gradle-version: '9.3.1'
      - name: Download Xray-core Android arm64-v8a
        shell: bash
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 3 -o xray-android.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -o xray-android.zip -d xray-android-unpacked
          cp "$(find xray-android-unpacked -name xray | head -1)" app/src/main/jniLibs/arm64-v8a/libxray.so
      - name: Generate debug keystore
        # debug.keystore is gitignored; create it fresh for debug-build signing.
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build APKs
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maximus-android-apks
          path: app/build/outputs/apk/*/release/*.apk

  windows-desktop:
    name: Desktop Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Pin to match release.yml and local verification — unpinned pulls
          # newer Gradle whose bundled Kotlin breaks the Compose compiler plugin.
          gradle-version: '9.3.1'
      - name: Download Xray-core Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src/main/resources/xray | Out-Null
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v${env:XRAY_VERSION}/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray-unpacked -Force
          Copy-Item (Get-ChildItem xray-unpacked -Recurse -Filter xray.exe | Select-Object -First 1).FullName desktop/src/main/resources/xray/xray.exe -Force
      - name: Compile
        working-directory: desktop
        run: gradle compileKotlin --no-daemon
      - name: Package EXE installer
        if: github.event_name != 'pull_request'
        working-directory: desktop
        # Quote the -P flag: PowerShell splits unquoted "0.0.0-ci" at the dot,
        # so Gradle saw "-PappVersion=0" and tried to run task ".0.0-ci".
        run: gradle packageExe "-PappVersion=0.0.0-ci" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maximus-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
        if: github.event_name != 'pull_request'

  ubuntu-desktop:
    name: Desktop Ubuntu x64 (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Pin to match release.yml and local verification — unpinned pulls
          # newer Gradle whose bundled Kotlin breaks the Compose compiler plugin.
          gradle-version: '9.3.1'
      # Linux DEB packaging is validated by release.yml on tags; here we verify the
      # shared Kotlin sources compile for Linux (same JVM sources).
      - name: Compile
        working-directory: desktop
        run: gradle compileKotlin --no-daemon
