name: Maximus CI Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  XRAY_VERSION: '26.7.28'

jobs:
  android:
    name: Android Debug + Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: replace-repaired-project-files
          fetch-depth: 0
      - name: Normalize Settings UI layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/drfxai/maximusvpn/ui/settings/SettingsScreen.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.text.style.TextOverflow' not in s:
              s = s.replace('import androidx.compose.ui.text.font.FontWeight\n','import androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextOverflow\n')
          start = s.index('@Composable\nprivate fun SettingToggleItem(')
          end = s.index('\nprivate fun getDnsLabel', start)
          replacement = '''@Composable
private fun SettingToggleItem(
    icon: ImageVector,
    title: String,
    subtitle: String,
    checked: Boolean,
    onCheckedChange: (Boolean) -> Unit
) {
    Row(
        modifier = Modifier
            .fillMaxWidth()
            .padding(vertical = 4.dp),
        verticalAlignment = Alignment.CenterVertically
    ) {
        Box(
            modifier = Modifier
                .size(36.dp)
                .clip(RoundedCornerShape(8.dp))
                .background(AppTheme.colors.surfaceElevated)
                .border(1.dp, AppTheme.colors.borderSubtle, RoundedCornerShape(8.dp)),
            contentAlignment = Alignment.Center
        ) {
            Icon(icon, contentDescription = null, tint = AppTheme.colors.primary, modifier = Modifier.size(18.dp))
        }
        Spacer(modifier = Modifier.width(12.dp))
        Column(
            modifier = Modifier
                .weight(1f)
                .padding(end = 10.dp)
        ) {
            Text(title, color = AppTheme.colors.textPrimary, fontSize = 13.sp, fontWeight = FontWeight.SemiBold, maxLines = 1, overflow = TextOverflow.Ellipsis)
            Text(subtitle, color = AppTheme.colors.textSecondary, fontSize = 11.sp, lineHeight = 15.sp, maxLines = 2, overflow = TextOverflow.Ellipsis)
        }
        Switch(
            checked = checked,
            onCheckedChange = onCheckedChange,
            colors = SwitchDefaults.colors(
                checkedThumbColor = AppTheme.colors.onPrimary,
                checkedTrackColor = AppTheme.colors.primary,
                uncheckedThumbColor = AppTheme.colors.textMuted,
                uncheckedTrackColor = AppTheme.colors.surfaceElevated
            )
        )
    }
}
'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/kotlin/com/drfxai/maximusvpn/ui/settings/SettingsScreen.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply Settings UI fix"
            git push origin HEAD:replace-repaired-project-files
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Download Xray-core Android arm64-v8a
        shell: bash
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 3 -o xray-android.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -o xray-android.zip -d xray-android-unpacked
          cp "$(find xray-android-unpacked -name xray | head -1)" app/src/main/jniLibs/arm64-v8a/libxray.so
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build APKs
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maximus-android-apks
          path: app/build/outputs/apk/*/release/*.apk

  windows-desktop:
    name: Desktop Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Download Xray-core Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src/main/resources/xray | Out-Null
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v${env:XRAY_VERSION}/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray-unpacked -Force
          Copy-Item (Get-ChildItem xray-unpacked -Recurse -Filter xray.exe | Select-Object -First 1).FullName desktop/src/main/resources/xray/xray.exe -Force
      - name: Download Wintun (pinned, checksum-verified)
        shell: pwsh
        env:
          WINTUN_VERSION: '0.14.1'
          WINTUN_SHA256: 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce'
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-${env:WINTUN_VERSION}.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-unpacked -Force
          $dll = "wintun-unpacked/wintun/bin/amd64/wintun.dll"
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${env:WINTUN_SHA256}") { throw "Wintun checksum mismatch: $hash" }
          Copy-Item $dll desktop/src/main/resources/xray/wintun.dll -Force
      - name: Compile
        working-directory: desktop
        run: gradle compileKotlin --no-daemon
      - name: Package EXE installer
        if: github.event_name != 'pull_request'
        working-directory: desktop
        run: gradle packageExe "-PappVersion=0.0.0-ci" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maximus-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
        if: github.event_name != 'pull_request'

  ubuntu-desktop:
    name: Desktop Ubuntu x64 (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Compile
        working-directory: desktop
        run: gradle compileKotlin --no-daemon
