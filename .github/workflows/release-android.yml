name: Maximus VPN Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v2.5.3'
        required: true
        default: 'v2.5.3'

permissions:
  contents: write

env:
  XRAY_VERSION: '26.7.28'

jobs:
  android-release:
    name: Android arm64-v8a signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then TAG="${{ inputs.tag }}"; fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          CODE="${VERSION//./}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Verify production signing configuration
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PATH" || { echo 'KEYSTORE_PATH is not configured'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'STORE_PASSWORD is not configured'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'KEY_PASSWORD is not configured'; exit 1; }
          test -f "$KEYSTORE_PATH" || { echo "Keystore not found: $KEYSTORE_PATH"; exit 1; }

      - name: Download Xray-core Android arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 3 -o xray-android.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -o xray-android.zip -d xray-android-unpacked
          XRAY_BIN=$(find xray-android-unpacked -type f -name xray | head -n 1)
          test -n "$XRAY_BIN"
          cp "$XRAY_BIN" app/src/main/jniLibs/arm64-v8a/libxray.so
          test -s app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Generate debug keystore for unit tests
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build signed APK + AAB
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.code }}" \
            --no-daemon
          test -s app/build/outputs/apk/release/*.apk
          test -s app/build/outputs/bundle/release/*.aab

      - name: Validate package identity and release signature
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          apksigner verify --verbose "$APK"
          apksigner verify --print-certs "$APK" | tee current-certs.txt
          CURRENT=$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' current-certs.txt)
          test -n "$CURRENT"
          echo "Current release certificate: $CURRENT"

          # Compare against the last known-good Maximus VPN release identity.
          curl -L --fail --retry 3 -o previous.apk \
            "https://github.com/drfxai/Maximus-VPN/releases/download/v2.5.1/Maximus-VPN-Android-arm64-v8a-2.5.1.apk"
          apksigner verify --verbose previous.apk
          apksigner verify --print-certs previous.apk | tee previous-certs.txt
          PREVIOUS=$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' previous-certs.txt)
          test -n "$PREVIOUS"
          echo "v2.5.1 certificate: $PREVIOUS"
          test "$CURRENT" = "$PREVIOUS" || {
            echo 'ERROR: v2.5.3 is not signed with the v2.5.1 certificate. Refusing publication because Android upgrades require the same signing identity.'
            exit 1
          }

          PKG=$(apkanalyzer manifest application-id "$APK")
          test "$PKG" = 'com.drfxai.maximusvpn' || {
            echo "Unexpected applicationId: $PKG"
            exit 1
          }

      - name: Collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk "release/Maximus-VPN-Android-arm64-v8a-${{ steps.version.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/*.aab "release/Maximus-VPN-Android-arm64-v8a-${{ steps.version.outputs.version }}.aab"
          sha256sum release/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Maximus VPN ${{ steps.version.outputs.tag }}" \
            --notes "## Maximus VPN ${{ steps.version.outputs.tag }}\n\nAndroid arm64-v8a release with the repaired Xray runtime path, corrected Security & Tunneling settings layout, strict release signing, and v2.5.1 certificate compatibility verification.\n\n### Android\n- APK (arm64-v8a)\n- AAB (arm64-v8a)\n- Xray-core 26.7.28\n- Version code ${{ steps.version.outputs.code }}"
