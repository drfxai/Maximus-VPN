name: Repair Settings UI

on:
  push:
    branches: [fix-settings-ui-and-xray-runtime]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-settings-ui-and-xray-runtime
          fetch-depth: 0
      - name: Remove nested About card from security toggles
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/drfxai/maximusvpn/ui/settings/SettingsScreen.kt')
          s = p.read_text()
          marker = '\n        Spacer(Modifier.height(16.dp))\n        Card(\n'
          start = s.index(marker)
          end = s.index('\n    }\n}\n\nprivate fun getDnsLabel', start)
          s = s[:start] + '\n    }\n}\n\nprivate fun getDnsLabel' + s[end + len('\n    }\n}\n\nprivate fun getDnsLabel'):]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/kotlin/com/drfxai/maximusvpn/ui/settings/SettingsScreen.kt
          if ! git diff --cached --quiet; then
            git commit -m "Repair Settings UI layout"
            git push origin HEAD:fix-settings-ui-and-xray-runtime
          fi
