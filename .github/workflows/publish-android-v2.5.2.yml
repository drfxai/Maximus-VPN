name: Publish Maximus VPN Android v2.5.2

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  XRAY_VERSION: '26.7.28'
  VERSION_NAME: '2.5.2'
  VERSION_CODE: '252'

jobs:
  release:
    if: ${{ startsWith(github.event.head_commit.message, 'Publish Android v2.5.2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Download Xray-core Android arm64-v8a
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 3 -o xray-android.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -o xray-android.zip -d xray-android-unpacked
          XRAY_BIN=$(find xray-android-unpacked -type f -name xray | head -n 1)
          test -n "$XRAY_BIN"
          cp "$XRAY_BIN" app/src/main/jniLibs/arm64-v8a/libxray.so
          test -s app/src/main/jniLibs/arm64-v8a/libxray.so
      - name: Generate CI debug keystore
        run: |
          keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build Android release artifacts
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease :app:bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE" \
            --no-daemon
          mkdir -p release
          cp app/build/outputs/apk/release/*.apk "release/Maximus-VPN-Android-arm64-v8a-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "release/Maximus-VPN-Android-arm64-v8a-${VERSION_NAME}.aab"
          ls -lh release/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.5.2 release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Maximus VPN v2.5.2" \
            --notes "## Maximus VPN v2.5.2\n\nAndroid arm64-v8a release with the Xray runtime-path repair, corrected Security & Tunneling settings layout, and Android build version 2.5.2.\n\n- APK (arm64-v8a)\n- AAB (arm64-v8a)\n- Xray-core 26.7.28\n- Version code 252"
